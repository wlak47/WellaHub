<!doctype html>
<html lang="en" data-theme="dark" class="web-client">
<head>
  <meta charset="utf-8">

  <script src="assets/app-theme.js"></script>

  <link rel="stylesheet" href="assets/app-style.css">
  <style>
    html{--red:#ff3d9a;--onred:#fff;--red2:#d92080}html,body{height:100%;margin:0}body{overflow:auto;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none}.top{position:sticky;top:0;z-index:2;background:var(--bg);padding-inline:18px}.top .logo{object-fit:contain}.brand{margin-right:15px}.tabs{margin-left:auto}.shell{min-height:0;flex:1}.main{overflow:visible;padding:27px 22px}.main>*{max-width:none}.foot{position:sticky;bottom:0;background:var(--bg);height:38px;z-index:2;padding-inline:16px;font-size:10px}.demo-label{margin:-12px 0 14px;color:var(--mut);font-size:10px}.demo-label b{color:var(--red);font:9px "Cascadia Mono",Consolas,monospace;letter-spacing:1px}.card{max-width:none}.games{min-height:100px}.g .hrs .steamhrs,.g .hrs .steamunit{color:var(--mut)}.demo-game-art{background:linear-gradient(135deg,hsl(var(--hue) 47% 26%),hsl(calc(var(--hue) + 34) 43% 12%));color:#ffe7f4}.demo-free-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.demo-free-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);padding-bottom:10px}.demo-free-card .art{height:85px;display:grid;place-items:center;font-weight:800;letter-spacing:1px;background:linear-gradient(140deg,hsl(var(--hue) 55% 35%),hsl(calc(var(--hue) + 70) 40% 14%))}.demo-free-card b,.demo-free-card small{display:block;margin:7px 10px}.demo-free-card b{font-size:12px}.demo-free-card small{font-size:10px;color:var(--mut)}.demo-preview-controls{display:flex;gap:8px;align-items:center;margin-bottom:14px}.demo-preview-controls .in{max-width:370px}.demo-preview-controls .btn{padding:8px 12px}.demo-fake-button{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 12px;color:var(--mut);font:600 11px inherit}.demo-fake-button:hover{border-color:var(--red);color:var(--text)}
    @media(max-width:820px){body{overflow:auto}.top{position:relative;padding-inline:12px}.brand{margin-right:0}.tabs{margin:0}.main{padding:16px 12px 24px}.head-actions{display:none}.card{padding:10px}.foot{display:none}.demo-preview-controls{flex-wrap:wrap}.demo-preview-controls .in{max-width:none;flex:1 1 100%}.demo-free-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.demo-free-card .art{height:70px}}
  </style>
</head>

  </header>
  <div class="shell" id="viewBoost"><nav class="side" id="side"></nav><main class="main">

  <footer class="foot"><div class="fl"><span class="gl">guns.lol</span><span>17:19:09</span><span>7 accounts · 7 boosting</span><span>v0.2-testbuild</span></div><div class="fr"><span class="pill"><i class="pd"></i><b>Online</b></span><span class="made">Made with <i class="heart">♥</i> by Wella</span></div></footer>

</html>
